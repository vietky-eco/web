name: Viet Ky PR Report

on:
  workflow_run:
    workflows: ["Repository Validation"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  report:
    name: Publish PR Report
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    steps:
      - name: Publish Quality Report
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const prNumber = run.pull_requests?.[0]?.number;

            if (!prNumber) {
              core.info("No linked PR. Skipping report.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              }
            );

            const job = jobs.find(
              j => j.name === "Validate JS, JSON & Web Quality"
            );

            const result = (name) => {
              return job?.steps?.find(
                step => step.name === name
              )?.conclusion || "skipped";
            };

            const status = (value) => ({
              success: " Passed",
              failure: " Failed",
              skipped: " Skipped",
              cancelled: " Cancelled"
            }[value] || " Unknown");

            const overall = status(run.conclusion);

            const marker = "<!-- vietky-ci-report -->";

            const body = `${marker}
            ## VIỆT KÝ · Quality Report

            **Overall:** ${overall}

            | Nội dung kiểm tra | Công cụ | Kết quả |
            |---|---|---|
            | Cú pháp mã nguồn JS & JSON | Node.js | ${status(result("Validate JS and JSON"))} |
            | Lỗi và chất lượng mã JavaScript | ESLint | ${status(result("ESLint"))} |
            | Chức năng và tương tác trên trình duyệt | Playwright | ${status(result("Playwright"))} |
            | Hiệu năng, khả năng truy cập và SEO | Lighthouse CI | ${status(result("Lighthouse CI"))} |

            ### Chi tiết
            - **Branch:** \`${run.head_branch}\`
            - **Run:** #${run.run_number}
            - **Workflow:** Repository Validation

            [Xem kết quả CI/CD](${run.html_url})

            ---
            *Automated by GitHub Actions · VIỆT KÝ*
            `;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100
              }
            );

            const previous = comments.find(
              comment =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }
