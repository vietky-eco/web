<body id="top">
  <a class="vk-skip-link" href="#main-content">Đến nội dung chính</a>
  <div id="site-header"></div>
  <main id="main-content" class="sq-page">
    <header class="sq-hero">
      <p class="sq-kicker">DÒNG CHẢY LỊCH SỬ VIỆT NAM</p>
      <h1>Toàn cảnh lịch sử</h1>
      <p>Khám phá các thời kỳ, sự kiện và những dấu mốc tiêu biểu trong lịch sử Việt Nam.</p>
    </header>
    <section class="su-quyen" hidden aria-label="Sử Quyển">
    <div class="composition" data-selected="1">
      <button class="arrow previous" type="button" aria-label="Chọn thời kỳ trước"></button>
      <div class="scroll">
        <div class="sheet-shadow" aria-hidden="true">
          <div class="sheet"><div class="pigment"></div></div>
        </div>
        <div class="periods" role="group" aria-label="Các thời kỳ"></div>
        <img class="roller left" src="/assets/su-quyen/scroll-left.png" width="63" height="195" alt="">
        <img class="roller right" src="/assets/su-quyen/scroll-right.png" width="63" height="195" alt="">
      </div>
      <button class="arrow next" type="button" aria-label="Chọn thời kỳ sau"></button>
      <div class="dots" aria-hidden="true" hidden></div>
    </div>
  </section>
    <section class="sq-overview" aria-labelledby="period-name" hidden>
      <div class="sq-chapter-title">
        <h2 id="period-name"></h2>
        <p id="period-dates"></p>
      </div>
      <div class="sq-chapter-copy">
        <p id="period-summary"></p>
        <p class="sq-capital" hidden><span class="sq-capital-label">Kinh đô</span><span id="period-capital"></span></p>
      </div>
    </section>
    <section class="sq-events" aria-labelledby="events-title">
      <header class="sq-events-heading">
        <h2 id="events-title">Các sự kiện tiêu biểu</h2>
        <p id="event-count" role="status">Đang tải…</p>
      </header>
      <ol id="timeline" aria-label="Các sự kiện theo thời gian"></ol>
      <div class="sq-events-empty" hidden>
        <h3>Chưa có sự kiện tiêu biểu</h3>
        <p>Việt Ký đang tiếp tục cập nhật các mốc tiêu biểu cho thời kỳ này.</p>
      </div>
    </section>
  </main>
  <div class="back-to-top-anchor"></div>
  <div id="site-footer"></div>
  <div id="site-scroll-progress"></div>
  <script src="/js/components/back-to-top.js" defer></script>
  <script type="module" src="/js/core/component-loader.js?v=2"></script>
  <script type="module" src="/js/pages/su-quyen.js"></script>
</body>
</html>
